[package]
name = "winnower"
version = "0.1.0-rc.2"
edition = "2024"
description = "Frees disk space by deleting generated files listed in per-project .winnow files"
license = "MIT"
repository = "https://github.com/MishkaSimakov/winnower"
readme = "README.md"
keywords = ["cleanup", "disk-space", "node_modules", "gitignore", "cli"]
categories = ["command-line-utilities", "filesystem"]
exclude = ["/.github", "/docs/demo.gif"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
humantime = "2.4.0"
ignore = "0.4.33"
walkdir = "2.5.0"

[dev-dependencies]
assert_cmd = "2.2.2"
filetime = "0.2.29"
predicates = "3.1.4"
tempfile = "3.27.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
